# Cloudflare Worker 配置 - ESP32 BLE HID Controller
name = "cf-esp32-blehid"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 环境变量
[vars]
PASSWORD = "admin"
COOKIE_SECRET = "change-me-to-a-random-string-at-least-32-chars"
DEVICE_SECRET = "esp32-blehid-device-key-change-me"


# 启用 WebSocket 支持 (免费计划需启用 SQLite)
[durable_objects]
bindings = [
  { name = "WS_DO", class_name = "WebSocketDurableObject" },
  { name = "RATE_LIMITER", class_name = "RateLimiterDO" }
]

# 路由 - 所有请求由 Worker 处理
[[migrations]]
tag = "v2"
new_sqlite_classes = ["WebSocketDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimiterDO"]

